[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-release-automation"
version = "1.6.1"
description = "Local automation for Google Play, AdMob, and RevenueCat."
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "keyring>=25.0.0",
    "requests>=2.32.3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[project.scripts]
mra = "mra.cli:main"
mra-agent = "mra.secure_cli:main"
mra-mcp = "mra.secure_mcp_server:main"
mra-agent-mcp = "mra.secure_mcp_server:main"

[tool.setuptools]
packages = ["mra"]
