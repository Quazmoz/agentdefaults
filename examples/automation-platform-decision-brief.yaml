request:
  name: Provision and deploy an internal application
  desired_outcome: Create the required cloud infrastructure, configure the hosts, build the application, and deploy it through controlled environments.
  current_process: Manual cloud changes, shell scripts, and one Jenkins freestyle job.
  current_platforms:
    - jenkins
    - shell
  repository_urls: []

targets:
  types:
    - cloud_resources
    - virtual_machines
    - applications
    - artifacts
  environments:
    - development
    - test
    - production
  estimated_count: 24
  inventory_source: Cloud tags and Terraform outputs
  connectivity: Jenkins agents can reach cloud APIs and Ansible control nodes can reach targets over SSH.
  privilege_requirements: Ansible requires controlled sudo for application and service configuration.

lifecycle:
  actions:
    - create
    - change
    - configure
    - build
    - test
    - deploy
    - verify
    - rollback
    - destroy
  source_of_truth: Git repositories for Terraform, Ansible, application code, and Jenkins pipeline definitions
  desired_state_required: true
  drift_detection_required: true
  destroy_allowed: true
  rollback_expectation: Application rollback must restore the previous immutable artifact. Infrastructure rollback is change-specific and must not default to destroy.
  recovery_objective: A failed stage must be diagnosable and safely resumable or rerunnable without duplicating resources.

execution:
  trigger: source_control
  frequency: Several development runs per day and controlled production releases
  build_required: true
  test_required: true
  artifact_required: true
  approval_required: true
  parallelism: Tests may run in parallel. Production infrastructure and deployment stages are serialized.
  concurrency_controls: One production infrastructure change and one production deployment at a time.
  maintenance_window: Production infrastructure replacement requires an approved window.

security:
  credential_sources:
    - Jenkins credentials for short-lived execution identities
    - cloud workload identity
    - Ansible Vault or approved enterprise secret manager
  secret_manager: Enterprise secret manager
  separation_of_duties: Developers may generate plans. Production apply and deployment require an operations approval.
  network_restrictions: Production targets are reachable only from approved automation workers.

governance:
  audit_required: true
  production_impact: high
  approval_model: Pull-request approval plus protected Jenkins production stage
  evidence_retention: Retain plans, approvals, test reports, artifact identifiers, deployment results, and verification evidence for one year.
  change_management: Link production runs to an approved change record.
  support_owner: Platform Automation team

existing_capabilities:
  terraform: Remote state backend and standard cloud modules are available.
  ansible: Automation controller, execution environments, inventories, and baseline roles are available.
  jenkins: Managed controller, ephemeral agents, shared libraries, artifact integration, and approval controls are available.
  team_skills: Strong Terraform and Ansible skills with established Jenkins pipeline support.
  constraints:
    - Do not store Terraform state in Jenkins workspaces.
    - Build the application artifact once and promote it unchanged.
    - Do not place production secrets in repository variables.

outputs:
  - executive_decision
  - workload_decomposition
  - hard_fit_analysis
  - weighted_matrix
  - ownership_map
  - execution_flow
  - handoff_contracts
  - security_controls
  - recovery_plan
  - pilot_plan
  - implementation_backlog
  - architecture_decision_record
  - markdown
